<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Djomok — Kopi & Sarapan</title>
</head>
<frameset cols="220,*" frameborder="0" border="0">
  <frame src="frames/sidebar.html" name="sidebarFrame" title="Sidebar navigasi">
  <frameset rows="52,*,70" frameborder="0" border="0">
    <frame src="frames/topline.html" name="toplineFrame" title="Informasi kafe">
    <frame src="frames/content.html#beranda" name="mainFrame" title="Konten utama">
    <frame src="frames/footer.html" name="footerFrame" title="Footer">
  </frameset>
  <noframes>
    <body>
      <p>Browser Anda tidak mendukung frameset. Buka <a href="frames/content.html">konten utama</a>.</p>
    </body>
  </noframes>
</frameset>
<script>
  const layout = document.querySelector("frameset");
  const contentLayout = layout.querySelector("frameset");
  const mobileScreen = window.matchMedia("(max-width: 700px)");

  function resizeFrames() {
    const isMobile = mobileScreen.matches;
    layout.setAttribute("cols", isMobile ? "0,*" : "220,*");
    contentLayout.setAttribute("rows", isMobile ? "0,*,70" : "52,*,70");
  }

  resizeFrames();
  mobileScreen.addEventListener("change", resizeFrames);
  window.addEventListener("resize", resizeFrames);
  window.addEventListener("orientationchange", resizeFrames);
</script>
</html>
