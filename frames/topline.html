<!DOCTYPE html>

<body class="frame-topline">
  <div class="topline">
    <span>Ngopi rek — <time id="currentDate" datetime=""></time></span>
    <a href="mailto:desutora71@gmail.com">desutora71@gmail.com</a>

  <script>
    const today = new Date();
    const currentDate = document.querySelector("#currentDate");
    currentDate.textContent = new Intl.DateTimeFormat("id-ID", {
      day: "2-digit", month: "long", year: "numeric"
    }).format(today);
    currentDate.dateTime = today.toISOString().split("T")[0];
